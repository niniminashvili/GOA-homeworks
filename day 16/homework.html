     <!-- 1) -->

      <!-- 2) -->

      <h2>საყვარელი ანიმაციის ტრეილერი</h2>

      <iframe>
        width="600"
            src="https://www.youtube.com/embed/fq5zU9T_Hl4?si=2zTfzoIM_WvTaVSz" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen"

      <!-- 3) -->
       <h2>რეგისტრაციის ფორმა</h2>

       <form>

        <label for="name">სახელი:</label><br>
        <input type="text" id="name" required><br><br>

        <label for="surname">გვარი:</label><br>
        <input type="text" id="surname" required><br><br>

        <label for="email">ელ-ფოსტა:</label><br>
        <input type="email" id="email" required><br><br>

        <label for="password">პაროლი:</label><br>
        <input type="password" id="password" required><br><br>

        <label for="age">ასაკი:</label><br>
        <input type="number" id="age" min="1" max="120"><br><br>

        <label for="birth">დაბადების თარიღი:</label><br>
        <input type="date" id="birth"><br><br>

        <label>სქესი:</label><br>
        <input type="radio" name="gender"> მამრობითი
        <input type="radio" name="gender"> მდედრობითი

        <br><br>

        <label for="country">ქვეყანა:</label><br>
        <select id="country">

            <option>საქართველო</option>

            <option>გერმანია</option>

            <option>საფრანგეთი</option>

            <option>აშშ</option>

        </select>

        <br><br>

        <label for="color">საყვარელი ფერი:</label><br>
        <input type="color" id="color"><br><br>

</body>
